[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasm"
version = "0.1.0"
description = "Durable agent state machine: DAG workflows with checkpointing, crash recovery and exponential retries"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["dasm*"]
